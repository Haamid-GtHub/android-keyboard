name: Sync FUTO Updates And Build Haamid Keyboard

on:
  workflow_dispatch:
  schedule:
    # Check upstream once every day.
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: haamid-upstream-sync
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Haamid Branch And Submodules
        uses: actions/checkout@v4
        with:
          ref: haamid-strict-title-case
          submodules: recursive
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch FUTO Upstream
        run: |
          git remote add upstream https://github.com/futo-org/android-keyboard.git
          git fetch upstream master

      - name: Merge Upstream Without Overwriting Haamid Changes
        id: sync
        run: |
          before_sha="$(git rev-parse HEAD)"
          set +e
          git merge --no-edit upstream/master
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            git merge --abort || true
            echo "::error::FUTO's update conflicts with custom Haamid changes. No merge was pushed. The conflict must be resolved before this update can be built."
            exit 1
          fi
          after_sha="$(git rev-parse HEAD)"
          if [ "$before_sha" = "$after_sha" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No new FUTO changes. Skipping build and release."
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            git push origin HEAD:haamid-strict-title-case
          fi

      - name: Set Up Java
        if: steps.sync.outputs.updated == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        if: steps.sync.outputs.updated == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build Updated Haamid Keyboard Release APK
        if: steps.sync.outputs.updated == 'true'
        env:
          BRANCH_NAME: haamid-strict-title-case
        run: |
          # Date-based version code stays above build 61 and increases for daily upstream updates.
          export VERSION_CODE="$(( $(date -u +%Y%m%d) * 100 + GITHUB_RUN_NUMBER % 100 ))"
          export VERSION_NAME="0.0.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "Building version $VERSION_NAME (code $VERSION_CODE)"
          ./gradlew assembleUnstableRelease --stacktrace

      - name: Upload APK Artifact
        if: steps.sync.outputs.updated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: haamid-keyboard-unstable-release-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 14

      - name: Publish Updated APK Release
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find . -path '*/build/outputs/apk/*/*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Built APK could not be found."
            exit 1
          fi
          cp "$APK" HaamidKeyboard.apk
          DATE_TAG="$(date -u +%Y%m%d)"
          TAG="haamid-upstream-${DATE_TAG}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" HaamidKeyboard.apk \
            --title "Haamid Keyboard Upstream Update ${DATE_TAG}" \
            --notes "Automatically built after syncing upstream FUTO source with Haamid's custom formatter. Install and test this update on your device. Android may require you to confirm installation."

      - name: Publish Updated Release APK
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find . -path '*/build/outputs/apk/*/*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Built APK could not be found."
            exit 1
          fi
          cp "$APK" HaamidKeyboard.apk
          DATE_TAG="$(date -u +%Y%m%d)"
          TAG="haamid-upstream-${DATE_TAG}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" HaamidKeyboard.apk \
            --title "Haamid Keyboard Release ${DATE_TAG}" \
            --notes "Release-variant sideload APK built after syncing upstream FUTO source with Haamid's custom formatter. This is not a Play Store release. Android may require confirmation to install it."
