name: Sync FUTO Updates And Build Stable Haamid Keyboard

on:
  workflow_dispatch:
  schedule:
    # Check upstream once every day.
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: haamid-upstream-sync
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Haamid Branch And Submodules
        uses: actions/checkout@v4
        with:
          ref: haamid-strict-title-case
          submodules: recursive
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch FUTO Upstream
        run: |
          git remote add upstream https://github.com/futo-org/android-keyboard.git
          git fetch upstream master

      - name: Merge Upstream Without Overwriting Haamid Changes
        run: |
          set +e
          git merge --no-edit upstream/master
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            git merge --abort || true
            echo "::error::FUTO's update conflicts with custom Haamid changes. No merge was pushed. The conflict must be resolved before this update can be built."
            exit 1
          fi

      - name: Push Updated Branch
        run: git push origin HEAD:haamid-strict-title-case

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Stable Release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.0.${{ github.run_number }}
          BRANCH_NAME: haamid-strict-title-case
        run: ./gradlew assembleStableRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haamid-keyboard-stable-release-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK Release For Easy Download
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          APK="$(find . -path '*/build/outputs/apk/*/*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Built APK could not be found."
            exit 1
          fi
          cp "$APK" HaamidKeyboard.apk
          TAG="haamid-stable-auto-$VERSION_CODE"
          gh release create "$TAG" HaamidKeyboard.apk \
            --title "Haamid Keyboard Stable Auto $VERSION_CODE" \
            --notes "Stable-flavor sideloadable APK built after merging the latest FUTO upstream changes into Haamid's custom Title Case branch. This is not a Play Store-published or Play Store-signed app. Android may require the user to confirm installation; it does not silently update an installed app."
