name: Build Haamid Keyboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - haamid-strict-title-case

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository And Submodules
        uses: actions/checkout@v4
        with:
          ref: haamid-strict-title-case
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Shared Signing Key Is Present
        run: test -f java/shared.keystore && test ! -f keystore.properties

      - name: Set Build Version
        shell: bash
        run: |
          VERSION_CODE="$(date +%s)"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.0.$VERSION_CODE" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=haamid-strict-title-case" >> "$GITHUB_ENV"
          echo "BUILD_TAG=haamid-stable-manual-$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build Stable Release APK
        run: ./gradlew assembleStableRelease --stacktrace

      - name: Verify Package Name And Signing Certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -path '*/build/outputs/apk/stable/release/*.apk' -type f -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Stable release APK was not found."
            exit 1
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='org.futo.inputmethod.latin'"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haamid-keyboard-stable-release-apk
          path: '**/build/outputs/apk/stable/release/*.apk'
          if-no-files-found: error
          retention-days: 14

      - name: Publish Installable APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find . -path '*/build/outputs/apk/stable/release/*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Built stable release APK could not be found."
            exit 1
          fi
          cp "$APK" HaamidKeyboard.apk
          TAG="$BUILD_TAG"
          gh release create "$TAG" HaamidKeyboard.apk \
            --title "Haamid Keyboard Stable Manual $VERSION_CODE" \
            --notes "Stable-flavor APK built from branch haamid-strict-title-case. Package: org.futo.inputmethod.latin. Uses the repository's shared signing keystore. Install over a previous Haamid build only if Android confirms the signing certificate matches."
