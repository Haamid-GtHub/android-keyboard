name: Build Haamid Keyboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - haamid-strict-title-case

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository And Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Unstable Release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.0.${{ github.run_number }}
          BRANCH_NAME: haamid-strict-title-case
        run: ./gradlew assembleUnstableRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haamid-keyboard-unstable-release-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 14

      - name: Publish Installable APK Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          APK="$(find . -path '*/build/outputs/apk/*/*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Built APK could not be found."
            exit 1
          fi
          cp "$APK" HaamidKeyboard.apk
          TAG="haamid-test-$VERSION_CODE"
          gh release create "$TAG" HaamidKeyboard.apk \
            --title "Haamid Keyboard Test $VERSION_CODE" \
            --notes "Release-variant sideload APK with Haamid's title-case formatter and manual Title Case action. This is not a Play Store release. Android may require the user to confirm installation; it does not silently update an installed app."
