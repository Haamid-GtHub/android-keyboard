name: Build Haamid Keyboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - haamid-strict-title-case

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check Out Repository And Submodules
        uses: actions/checkout@v4
        with:
          ref: haamid-strict-title-case
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Shared Signing Key Is Present
        run: test -f java/shared.keystore && test ! -f keystore.properties

      - name: Set Build Version
        shell: bash
        run: |
          VERSION_CODE="$(date +%s)"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.0.$VERSION_CODE" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=haamid-strict-title-case" >> "$GITHUB_ENV"
          echo "BUILD_TAG=haamid-untested-$VERSION_CODE" >> "$GITHUB_ENV"

      # Regression tests are intentionally skipped at the user's request.
      - name: Build Release APK
        run: ./gradlew assembleStableRelease --no-daemon --stacktrace

      - name: Verify Package Name And Signing Certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -path '*/build/outputs/apk/stable/release/*.apk' -type f -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Stable release APK was not found."
            exit 1
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='org.futo.inputmethod.latin'"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haamid-keyboard-apk-tests-skipped
          path: '**/build/outputs/apk/stable/release/*.apk'
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK Release (Tests Skipped)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find . -path '*/build/outputs/apk/stable/release/*.apk' -type f -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Built APK could not be found."
            exit 1
          fi
          cp "$APK" HaamidKeyboard.apk
          gh release create "$BUILD_TAG" HaamidKeyboard.apk \
            --title "Haamid Keyboard Build $VERSION_CODE (Tests Skipped)" \
            --prerelease \
            --notes "APK built from branch haamid-strict-title-case. Automated regression tests were intentionally skipped at the user's request. Package: org.futo.inputmethod.latin. The APK build, package name, and signing certificate are checked by this workflow, but app behavior is NOT regression-tested. Uses the repository's shared signing keystore."
