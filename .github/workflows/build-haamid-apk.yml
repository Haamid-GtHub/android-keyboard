name: Build Haamid Keyboard APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check Out Repository And Submodules
        uses: actions/checkout@v4
        with:
          ref: haamid-strict-title-case
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Shared Signing Key Is Present
        run: test -f java/shared.keystore && test ! -f keystore.properties

      - name: Set Build Version
        shell: bash
        run: |
          VERSION_CODE="$(date +%s)"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.0.$VERSION_CODE" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=haamid-strict-title-case" >> "$GITHUB_ENV"
          echo "BUILD_TAG=haamid-stable-manual-$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Run Android Regression Tests
        id: regression
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -no-audio -no-metrics -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew connectedStableDebugAndroidTest --no-daemon --stacktrace

      - name: Build Stable Release APK
        run: ./gradlew assembleStableRelease --stacktrace

      - name: Verify Package Name And Signing Certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -path '*/build/outputs/apk/stable/release/*.apk' -type f -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Stable release APK was not found."
            exit 1
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='org.futo.inputmethod.latin'"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haamid-keyboard-stable-release-apk
          path: '**/build/outputs/apk/stable/release/*.apk'
          if-no-files-found: error
          retention-days: 14

      - name: Publish Verified Stable APK Release
        if: steps.regression.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find . -path '*/build/outputs/apk/stable/release/*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Built stable release APK could not be found."
            exit 1
          fi
          cp "$APK" HaamidKeyboard.apk
          gh release create "$BUILD_TAG" HaamidKeyboard.apk \
            --title "Haamid Keyboard Stable Manual $VERSION_CODE" \
            --notes "Stable-flavor APK built from branch haamid-strict-title-case. Automated regression tests passed. Package: org.futo.inputmethod.latin. Uses the repository's shared signing keystore. Install over a previous Haamid build only if Android confirms the signing certificate matches."

      - name: Publish Test-Failed Candidate APK
        if: steps.regression.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find . -path '*/build/outputs/apk/stable/release/*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Candidate APK could not be found."
            exit 1
          fi
          cp "$APK" HaamidKeyboard.apk
          gh release create "haamid-candidate-$VERSION_CODE" HaamidKeyboard.apk \
            --title "Haamid Keyboard Candidate $VERSION_CODE — Tests Need Review" \
            --prerelease \
            --notes "Candidate APK built from branch haamid-strict-title-case so an automated test failure does not hide the build from the user. Regression tests did not pass; this is NOT a verified stable release. Review the linked Actions run before installing. Package: org.futo.inputmethod.latin. Uses the repository's shared signing keystore."
