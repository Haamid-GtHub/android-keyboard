name: Sync FUTO Source And Build Haamid Keyboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: haamid-upstream-sync
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Haamid branch and submodules
        uses: actions/checkout@v4
        with:
          ref: haamid-strict-title-case
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git and fetch FUTO source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Prefer FUTO's GitLab source; fall back to its GitHub mirror if unavailable.
          git remote add upstream https://gitlab.futo.org/keyboard/latinime.git
          if git fetch upstream master; then
            UPSTREAM_REF="upstream/master"
          elif git fetch upstream main; then
            UPSTREAM_REF="upstream/main"
          else
            echo "::warning::FUTO GitLab fetch failed; trying the GitHub mirror."
            git remote add futo-mirror https://github.com/futo-org/android-keyboard.git
            if git fetch futo-mirror master; then
              UPSTREAM_REF="futo-mirror/master"
            elif git fetch futo-mirror main; then
              UPSTREAM_REF="futo-mirror/main"
            else
              echo "::error::Could not fetch FUTO source from GitLab or GitHub mirror."
              exit 1
            fi
          fi
          echo "UPSTREAM_REF=$UPSTREAM_REF" >> "$GITHUB_ENV"
          echo "Using upstream ref: $UPSTREAM_REF"

      - name: Protect Haamid-customized files from upstream replacement
        id: protect
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git merge-base HEAD "$UPSTREAM_REF")" || {
            echo "::warning::No common base with FUTO was found. Keeping all Haamid code unchanged and building the existing app if upstream has new commits."
            echo "safe=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          git diff --name-only "$BASE"...HEAD | sort -u > /tmp/haamid-changed-files.txt
          git diff --name-only "$BASE...$UPSTREAM_REF" | sort -u > /tmp/futo-changed-files.txt
          comm -12 /tmp/haamid-changed-files.txt /tmp/futo-changed-files.txt > /tmp/overlapping-files.txt
          if [ -s /tmp/overlapping-files.txt ]; then
            echo "::warning::FUTO and Haamid both changed these files. To protect custom modifications, this run will not merge upstream source; it will build the current Haamid app and list the files for manual review."
            cat /tmp/overlapping-files.txt
            echo "safe=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No overlapping modified files found; safe to attempt the normal merge."
          echo "safe=true" >> "$GITHUB_OUTPUT"

      - name: Merge latest FUTO source without overwriting custom code
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(git rev-list --count "HEAD..$UPSTREAM_REF")"
          if [ "$COUNT" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "No new FUTO commits found; no APK will be built or published."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.protect.outputs.safe }}" != "true" ]; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "::warning::An upstream update exists, but automatic merging was skipped to protect Haamid customizations. The current customized app will still be built."
            exit 0
          fi

          if ! git merge --no-edit "$UPSTREAM_REF"; then
            git merge --abort || true
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FUTO update could not be merged cleanly. The existing customized app will still be built; no upstream source changes will be pushed."
            exit 0
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Set build version
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(date +%s)"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.0.$VERSION_CODE" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=haamid-strict-title-case" >> "$GITHUB_ENV"

      - name: Verify shared signing key exists
        if: steps.sync.outputs.changed == 'true'
        run: test -f java/shared.keystore && test ! -f keystore.properties

      - name: Set up Java
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.sync.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v4

      # Per user's instruction, do not run Android regression tests in this workflow.
      # A successful build and signing checks do not prove runtime behavior is bug-free.

      - name: Build stable release APK
        if: steps.sync.outputs.changed == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleStableRelease --no-daemon --stacktrace

      - name: Verify package name and signing certificate
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -path '*/build/outputs/apk/stable/release/*.apk' -type f -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Stable release APK was not found."
            exit 1
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='org.futo.inputmethod.latin'"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Prepare APK
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -path '*/build/outputs/apk/stable/release/*.apk' -type f -print -quit)"
          cp "$APK" HaamidKeyboard.apk

      - name: Push merged source update
        if: steps.sync.outputs.changed == 'true' && steps.sync.outputs.merged == 'true'
        run: git push origin HEAD:haamid-strict-title-case

      - name: Upload APK artifact
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HaamidKeyboard-FUTO-update-${{ env.VERSION_CODE }}
          path: HaamidKeyboard.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable-release APK for the existing Haamid app
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="haamid-futo-update-$VERSION_CODE"
          if [ "${{ steps.sync.outputs.merged }}" = "true" ]; then
            SOURCE_NOTE="FUTO upstream updates were merged because no customized files overlapped. Haamid customizations were retained."
          else
            TAG="haamid-futo-protected-build-$VERSION_CODE"
            SOURCE_NOTE="A FUTO update was detected, but automatic merging was skipped because files overlapped or the merge was unsafe. This APK was built from the existing Haamid-customized source to avoid overwriting custom modifications. Review the Actions log before expecting the latest FUTO changes."
          fi

          TEST_NOTE="Automated regression tests were intentionally skipped as requested. The release build and package/signature verification succeeded, but runtime behavior was not regression-tested."

          gh release create "$TAG" HaamidKeyboard.apk \
            --title "Haamid Keyboard — FUTO Check $VERSION_CODE" \
            --notes "$SOURCE_NOTE $TEST_NOTE Package: org.futo.inputmethod.latin. Built with the repository's shared signing keystore so it updates the existing app rather than installing as a separate package."
