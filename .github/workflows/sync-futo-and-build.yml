name: Protected FUTO Stable-Release Sync And Haamid Build

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: protected-futo-sync-haamid
  cancel-in-progress: false

jobs:
  sync-test-build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check Out Haamid Keyboard And Submodules
        uses: actions/checkout@v4
        with:
          ref: haamid-strict-title-case
          submodules: recursive
          fetch-depth: 0

      - name: Detect New Official Stable FUTO Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          FUTO_TAG="$(gh api repos/futo-org/android-keyboard/releases/latest --jq '.tag_name')"
          if [ -z "$FUTO_TAG" ]; then
            echo "::error::FUTO's latest stable release tag could not be read. No update was made."
            exit 1
          fi

          LAST_TAG="0.1.30"
          if [ -f .github/futo-last-stable-release ]; then
            LAST_TAG="$(tr -d '[:space:]' < .github/futo-last-stable-release)"
          fi

          echo "FUTO latest stable release: $FUTO_TAG"
          echo "Last successfully published FUTO release: $LAST_TAG"
          echo "futo_tag=$FUTO_TAG" >> "$GITHUB_OUTPUT"

          if [ "$FUTO_TAG" = "$LAST_TAG" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No new official stable FUTO release. No build will run."
            exit 0
          fi

          HAAMID_TAG="haamid-futo-$FUTO_TAG"
          if gh release view "$HAAMID_TAG" >/dev/null 2>&1; then
            echo "repair_marker=true" >> "$GITHUB_OUTPUT"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "This FUTO version already has a Haamid release. Only the tracking marker needs repair."
            exit 0
          fi

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "repair_marker=false" >> "$GITHUB_OUTPUT"

      - name: Repair Release Tracking Marker If A Previous Publish Was Interrupted
        if: steps.release.outputs.repair_marker == 'true'
        env:
          FUTO_TAG: ${{ steps.release.outputs.futo_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          printf '%s\n' "$FUTO_TAG" > .github/futo-last-stable-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/futo-last-stable-release
          git commit -m "Record successfully published FUTO release $FUTO_TAG"
          git push origin HEAD:refs/heads/haamid-strict-title-case

      - name: Fetch Exact FUTO Stable Release Source
        if: steps.release.outputs.updated == 'true'
        id: upstream
        env:
          FUTO_TAG: ${{ steps.release.outputs.futo_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add futo-mirror https://github.com/futo-org/android-keyboard.git
          git fetch --no-tags futo-mirror "refs/tags/$FUTO_TAG:refs/tags/futo-$FUTO_TAG"
          echo "ref=refs/tags/futo-$FUTO_TAG" >> "$GITHUB_OUTPUT"

      - name: Merge FUTO Release Without Overwriting Custom Code
        if: steps.release.outputs.updated == 'true'
        id: sync
        env:
          UPSTREAM_REF: ${{ steps.upstream.outputs.ref }}
          FUTO_TAG: ${{ steps.release.outputs.futo_tag }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git merge-base HEAD "$UPSTREAM_REF")" || {
            echo "::error::No common history with the official FUTO release was found. Nothing was changed."
            exit 1
          }

          # Fail closed if FUTO and Haamid both edited the same file since their common ancestor.
          # Even a clean line-level merge can introduce behavioural regressions in a shared file.
          CUSTOM_PATHS="$(git diff --name-only "$BASE" HEAD | sort -u)"
          UPSTREAM_PATHS="$(git diff --name-only "$BASE" "$UPSTREAM_REF" | sort -u)"
          OVERLAPPING_PATHS="$(comm -12 <(printf '%s\\n' "$CUSTOM_PATHS") <(printf '%s\\n' "$UPSTREAM_PATHS"))"
          if [ -n "$OVERLAPPING_PATHS" ]; then
            echo "::error::FUTO and Haamid changed the same files. Refusing automatic merge to protect custom keyboard features:"
            printf '%s\\n' "$OVERLAPPING_PATHS"
            exit 1
          fi

          if ! git diff --quiet "$BASE" "$UPSTREAM_REF" -- java/shared.keystore; then
            echo "::error::FUTO changed the shared signing keystore. Refusing to change the signing identity."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit "$UPSTREAM_REF"; then
            git merge --abort || true
            echo "::error::FUTO release changes conflict with Haamid's custom keyboard code. No update was pushed or released."
            exit 1
          fi

          git diff --check
          echo "Integrated official FUTO stable release $FUTO_TAG."

      - name: Refresh FUTO Submodules At The Release Revisions
        if: steps.release.outputs.updated == 'true'
        run: git submodule update --init --recursive

      - name: Verify Shared Signing Key Is Preserved
        if: steps.release.outputs.updated == 'true'
        run: |
          set -euo pipefail
          test -f java/shared.keystore
          test ! -f keystore.properties

      - name: Set Build Version
        if: steps.release.outputs.updated == 'true'
        env:
          FUTO_TAG: ${{ steps.release.outputs.futo_tag }}
        shell: bash
        run: |
          VERSION_CODE="$(date -u +%s)"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$FUTO_TAG-haamid" >> "$GITHUB_ENV"
          echo "FUTO_TAG=$FUTO_TAG" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=haamid-strict-title-case" >> "$GITHUB_ENV"

      - name: Set Up Java
        if: steps.release.outputs.updated == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        if: steps.release.outputs.updated == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Android Regression Test APK (Non-Blocking)
        if: steps.release.outputs.updated == 'true'
        id: test_apk_build
        continue-on-error: true
        run: ./gradlew assembleStableDebugAndroidTest --no-daemon --stacktrace

      - name: Run Android Regression Tests (Non-Blocking)
        if: steps.release.outputs.updated == 'true'
        id: regression
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -no-audio -no-metrics -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew connectedStableDebugAndroidTest --no-daemon --stacktrace

      - name: Build Stable Release APK
        if: steps.release.outputs.updated == 'true'
        run: ./gradlew assembleStableRelease --no-daemon --stacktrace

      - name: Verify Package Name And APK Signature
        if: steps.release.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -path '*/build/outputs/apk/stable/release/*.apk' -type f -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Stable release APK was not found."
            exit 1
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='org.futo.inputmethod.latin'"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/haamid-signature.txt
          NEW_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/haamid-signature.txt | head -n 1 | tr '[:upper:]' '[:lower:]')"
          if [ -z "$NEW_CERT" ]; then
            echo "::error::Could not read the new APK signing certificate fingerprint."
            exit 1
          fi

          # Compare against the last known stable Haamid APK, not merely against the keystore file's existence.
          mkdir -p /tmp/known-haamid
          gh release download haamid-stable-manual-1792830017 --repo Haamid-GtHub/android-keyboard \\
            --pattern HaamidKeyboard.apk --dir /tmp/known-haamid
          "$APKSIGNER" verify --print-certs /tmp/known-haamid/HaamidKeyboard.apk | tee /tmp/known-haamid-signature.txt
          KNOWN_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/known-haamid-signature.txt | head -n 1 | tr '[:upper:]' '[:lower:]')"
          if [ -z "$KNOWN_CERT" ] || [ "$NEW_CERT" != "$KNOWN_CERT" ]; then
            echo "::error::The new APK signing certificate does not match the trusted Haamid stable release. Refusing to publish an APK that may not update the installed app."
            exit 1
          fi
          echo "Signing certificate matches the trusted Haamid stable release."
          cp "$APK" HaamidKeyboard.apk

      - name: Upload Verified APK Artifact
        if: steps.release.outputs.updated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HaamidKeyboard-FUTO-${{ steps.release.outputs.futo_tag }}
          path: HaamidKeyboard.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Verified Haamid Release
        if: steps.release.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FUTO_TAG: ${{ steps.release.outputs.futo_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.test_apk_build.outcome }}" = "success" ] && [ "${{ steps.regression.outcome }}" = "success" ]; then
            TEST_NOTE="Automated Android regression tests passed."
          else
            TEST_NOTE="WARNING: Automated regression tests could not complete successfully (test APK build: ${{ steps.test_apk_build.outcome }}; emulator tests: ${{ steps.regression.outcome }}). These test failures did not block this release. The stable APK build, package-name check, and signing verification passed. Please install cautiously and report any issue."
          fi

          HAAMID_TAG="haamid-futo-$FUTO_TAG"
          gh release create "$HAAMID_TAG" HaamidKeyboard.apk \
            --target "$(git rev-parse HEAD)" \
            --title "Haamid Keyboard — FUTO $FUTO_TAG" \
            --notes "Based on FUTO's official stable app release $FUTO_TAG. FUTO changes were merged without forced conflict resolution. The existing shared signing keystore was preserved. $TEST_NOTE Package: org.futo.inputmethod.latin. Download and install this APK manually to update Haamid Keyboard."

          printf '%s\n' "$FUTO_TAG" > .github/futo-last-stable-release
          git add .github/futo-last-stable-release
          git commit -m "Record successfully published FUTO release $FUTO_TAG"
          git push origin HEAD:refs/heads/haamid-strict-title-case
