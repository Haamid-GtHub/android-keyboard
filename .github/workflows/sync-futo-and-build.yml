name: Sync FUTO Source And Build Haamid Keyboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: haamid-upstream-sync
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Haamid branch and submodules
        uses: actions/checkout@v4
        with:
          ref: haamid-strict-title-case
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git and fetch FUTO source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Prefer FUTO's GitLab source; fall back to its GitHub mirror if unavailable.
          git remote add upstream https://gitlab.futo.org/keyboard/latinime.git
          if git fetch upstream master; then
            UPSTREAM_REF="upstream/master"
          elif git fetch upstream main; then
            UPSTREAM_REF="upstream/main"
          else
            echo "::warning::FUTO GitLab fetch failed; trying the GitHub mirror."
            git remote add futo-mirror https://github.com/futo-org/android-keyboard.git
            if git fetch futo-mirror master; then
              UPSTREAM_REF="futo-mirror/master"
            elif git fetch futo-mirror main; then
              UPSTREAM_REF="futo-mirror/main"
            else
              echo "::error::Could not fetch FUTO source from GitLab or GitHub mirror."
              exit 1
            fi
          fi
          echo "UPSTREAM_REF=$UPSTREAM_REF" >> "$GITHUB_ENV"
          echo "Using upstream ref: $UPSTREAM_REF"

      - name: Merge latest FUTO source safely
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(git rev-list --count "HEAD..$UPSTREAM_REF")"
          if [ "$COUNT" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new FUTO commits found; keeping the current working build."
            exit 0
          fi

          if ! git merge --no-edit "$UPSTREAM_REF"; then
            git merge --abort || true
            echo "::error::FUTO updates conflict with Haamid customizations. No source update was pushed and no APK was published."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set build version
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(date +%s)"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.0.$VERSION_CODE" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=haamid-strict-title-case" >> "$GITHUB_ENV"

      - name: Verify shared signing key exists
        if: steps.sync.outputs.changed == 'true'
        run: test -f java/shared.keystore && test ! -f keystore.properties

      - name: Set up Java
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.sync.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android regression tests before publishing
        if: steps.sync.outputs.changed == 'true'
        id: regression
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -no-audio -no-metrics -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew connectedStableDebugAndroidTest --no-daemon --stacktrace

      - name: Build stable release APK
        if: steps.sync.outputs.changed == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleStableRelease --no-daemon --stacktrace

      - name: Verify package name and signing certificate
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -path '*/build/outputs/apk/stable/release/*.apk' -type f -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Stable release APK was not found."
            exit 1
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='org.futo.inputmethod.latin'"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Prepare APK
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -path '*/build/outputs/apk/stable/release/*.apk' -type f -print -quit)"
          cp "$APK" HaamidKeyboard.apk

      - name: Push merged source update
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:haamid-strict-title-case

      - name: Upload APK artifact
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HaamidKeyboard-FUTO-update-${{ env.VERSION_CODE }}
          path: HaamidKeyboard.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified stable APK release and notify watchers
        if: steps.sync.outputs.changed == 'true' && steps.regression.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="haamid-futo-update-$VERSION_CODE"
          gh release create "$TAG" HaamidKeyboard.apk \
            --title "Haamid Keyboard — FUTO Update $VERSION_CODE" \
            --notes "A new FUTO upstream source update was merged while retaining Haamid customizations. Automated regression tests passed. Package: org.futo.inputmethod.latin. Built with the repository's shared signing keystore. Watch repository releases for notifications."

      - name: Publish candidate APK if tests fail
        if: steps.sync.outputs.changed == 'true' && steps.regression.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="haamid-futo-candidate-$VERSION_CODE"
          gh release create "$TAG" HaamidKeyboard.apk \
            --title "Haamid Keyboard — FUTO Candidate $VERSION_CODE (Tests Need Review)" \
            --prerelease \
            --notes "A new FUTO upstream source update was merged while retaining Haamid customizations. The APK was built and package/signature checks passed, but automated regression tests did not pass or could not complete. This candidate is available so a test failure does not hide the update, but it is NOT a verified stable release. Review the Actions run before installing. Package: org.futo.inputmethod.latin. Built with the repository's shared signing keystore."
