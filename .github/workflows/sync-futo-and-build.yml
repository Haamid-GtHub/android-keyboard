name: Sync FUTO Source And Build Haamid Keyboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: haamid-upstream-sync
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Haamid branch and submodules
        uses: actions/checkout@v4
        with:
          ref: haamid-strict-title-case
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git and fetch FUTO source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/futo-org/android-keyboard.git
          git fetch upstream master

      - name: Merge latest FUTO source safely
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(git rev-list --count HEAD..upstream/master)"
          if [ "$COUNT" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new FUTO commits found; keeping the current working build."
            exit 0
          fi

          if ! git merge --no-edit upstream/master; then
            git merge --abort || true
            echo "::error::FUTO updates conflict with Haamid customizations. No source update was pushed and no APK was published."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set build version
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(date +%s)"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.0.$VERSION_CODE" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=haamid-strict-title-case" >> "$GITHUB_ENV"

      - name: Verify shared signing key exists
        if: steps.sync.outputs.changed == 'true'
        run: test -f java/shared.keystore && test ! -f keystore.properties

      - name: Set up Java
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.sync.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build stable release APK
        if: steps.sync.outputs.changed == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleStableRelease --no-daemon --stacktrace

      - name: Verify package name and signing certificate
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -path '*/build/outputs/apk/stable/release/*.apk' -type f -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Stable release APK was not found."
            exit 1
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='org.futo.inputmethod.latin'"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Prepare APK
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -path '*/build/outputs/apk/stable/release/*.apk' -type f -print -quit)"
          cp "$APK" HaamidKeyboard.apk

      - name: Push merged source update
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:haamid-strict-title-case

      - name: Upload APK artifact
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HaamidKeyboard-FUTO-update-${{ env.VERSION_CODE }}
          path: HaamidKeyboard.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release and notify watchers
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="haamid-futo-update-$VERSION_CODE"
          gh release create "$TAG" HaamidKeyboard.apk \
            --title "Haamid Keyboard — FUTO Update Built $VERSION_CODE" \
            --notes "A new FUTO upstream source update was merged and a stable APK was built successfully. Package: org.futo.inputmethod.latin. The APK is built using the repository's shared signing keystore (java/shared.keystore). This is a sideloadable APK, not a Play Store release. Watch repository releases to receive a notification when this build is published."
